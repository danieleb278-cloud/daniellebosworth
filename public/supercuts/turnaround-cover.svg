<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Monthly location sales grew from roughly four to five thousand dollars to more than twenty thousand dollars in about thirteen months">
  <rect width="800" height="600" fill="#0e0e0e"/>
  <g fill="none" stroke="#1f1f1f" stroke-width="1">
    <path d="M80 480H720M80 380H720M80 280H720M80 180H720"/>
  </g>
  <text x="80" y="90" fill="#9a9a9a" font-family="ui-monospace,Menlo,monospace" font-size="17" letter-spacing="3">MONTHLY LOCATION SALES</text>
  <path d="M80 470 C 240 460, 330 400, 420 330 S 620 190, 720 140" fill="none" stroke="#1c9c92" stroke-width="5" stroke-linecap="round"/>
  <circle cx="80" cy="470" r="8" fill="#1c9c92"/>
  <circle cx="720" cy="140" r="10" fill="#1c9c92"/>
  <text x="80" y="530" fill="#f2f2f2" font-family="Georgia,serif" font-size="40">~$4–5K</text>
  <text x="80" y="562" fill="#8d8d8d" font-family="ui-monospace,Menlo,monospace" font-size="15" letter-spacing="2">BASELINE</text>
  <text x="720" y="112" fill="#f2f2f2" font-family="Georgia,serif" font-size="44" text-anchor="end">$20K+</text>
  <text x="720" y="562" fill="#8d8d8d" font-family="ui-monospace,Menlo,monospace" font-size="15" letter-spacing="2" text-anchor="end">~13 MONTHS</text>
  <text x="720" y="530" fill="#1c9c92" font-family="Georgia,serif" font-size="40" text-anchor="end">4×+</text>
</svg>
